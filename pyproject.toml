[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sandboxes"
version = "0.9.75"
description = "Provider-aware gVisor sandbox control plane for Linux compute nodes"
readme = "README.md"
requires-python = ">=3.10.13"
dependencies = [
    "aiohttp>=3.10,<4",
    "boto3>=1.35,<2",
    "cryptography>=43,<52",
    "opentelemetry-api>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-sdk>=1.30,<2",
    "orjson>=3.11.9,<4",
    "urllib3>=2.2,<3",
]

[tool.uv]
exclude-newer = "2026-08-07T10:10:16.296145Z"

[project.optional-dependencies]
postgres = ["psycopg[binary,pool]>=3.2,<4"]

[project.scripts]
sandboxes = "sandboxes.cli:main"
sandboxes-storage = "sandboxes.storage_native_service:main"
sandboxes-snapshot-gc = "sandboxes.storage_native_s3_gc:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["sandboxes"]

[tool.hatch.build.targets.sdist]
exclude = ["/ucloud-sandboxes-sdk"]

[tool.ruff.lint]
select = ["C901", "E4", "E7", "E9", "F"]

[tool.ruff.lint.mccabe]
# Functions above this carry `# noqa: C901`. Lower it, and drop their
# noqa, as functions are split.
max-complexity = 40
